name: Osvežavanje studentskih novosti

on:
  schedule:
    - cron: '23 4,12,20 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-feeds
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run feeds:update
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_API_VERSION: ${{ vars.INSTAGRAM_API_VERSION || 'v25.0' }}
      - run: npm run check
      - name: Sačuvaj ažuriranu listu
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/external-news.json
          if [ -d public/media/instagram ]; then git add public/media/instagram; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Osveži studentske novosti"
          git push
